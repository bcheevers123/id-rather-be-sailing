name: Refresh data

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'requirements.txt'
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:        # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium --with-deps

      - name: Run data pipeline
        run: python -m pipeline.generate
        env:
          PYTHONUNBUFFERED: '1'
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git fetch origin main
          git merge --no-edit -X ours origin/main
          git push

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: public/data/coverage_report.json
          retention-days: 30
          if-no-files-found: warn
